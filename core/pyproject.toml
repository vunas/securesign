[project]
name = "core"
version = "0.1.0"
description = "Digital signature core engine and PKI services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "cryptography>=50.0.2",
    "pyhanko>=0.38.0",
    "pyhanko-certvalidator",
    "asn1crypto",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg",
    "aiofiles",
    "requests",
    "httpx",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "greenlet>=3.5.6",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "pytz>=2026.6",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
    "aiosqlite>=0.22.1",
    "psycopg2-binary>=2.9.13",
    "pyjwt[crypto]>=2.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-ignore = ["E203", "E266", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "pyhanko.*",
    "pyhanko_certvalidator.*",
    "asn1crypto.*",
    "pytz.*",
    "aiofiles.*",
    "requests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = "."
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*sqlalchemy.*declarative_base.*:DeprecationWarning",
    "ignore::DeprecationWarning:supabase.*:",
    "ignore::DeprecationWarning:httpx.*:",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: integration tests with FastAPI and DB",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
