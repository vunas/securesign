version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_signature_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
      ALGORITHM: ${ALGORITHM:-HS256}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-uO12M9L4hN4b6s4mXqK_3jJ_n-pXGvL9QvO2zZqE2y0=}
      TSA_URL: ${TSA_URL:-http://timestamp.digicert.com}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-digital_signature_db}}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - api_storage:/app/storage

volumes:
  postgres_data:
  api_storage:
