services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_signature_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securesign-demo-db-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-securesign-demo-only-secret-key-change-before-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-uO12M9L4hN4b6s4mXqK_3jJ_n-pXGvL9QvO2zZqE2y0=}
      TSA_URL: ${TSA_URL:-http://timestamp.digicert.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEFAULT_MONTHLY_SIGNING_LIMIT: ${DEFAULT_MONTHLY_SIGNING_LIMIT:-1000}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-20971520}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-securesign-demo-db-password}@db:5432/${POSTGRES_DB:-digital_signature_db}
    ports:
      - "${APP_PORT:-8000}:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8000}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
